name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # only needed to attach APKs to tagged releases

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Test plugin runtime
        run: node scripts/test_plugins.js

      # Generates the React Native Android scaffold (if android/ is missing),
      # copies the native keyboard sources into it and patches the manifest.
      - name: Bootstrap project
        run: bash scripts/bootstrap.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/OpenKeys-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenKeys-apk
          path: dist/*.apk
          retention-days: 30

      - name: Attach to GitHub release (tags like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
