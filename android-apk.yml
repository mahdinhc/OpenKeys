name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already ships the Android SDK; just accept licenses so Gradle can fetch parts
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # 1) Build the real CyberChef core into a single-file engine for the WebView
      - name: Install CyberChef dependencies
        run: npm ci

      - name: Generate CyberChef operation config
        run: npx grunt exec:generateConfig

      - name: Bundle CyberChef engine
        run: NODE_OPTIONS=--max-old-space-size=8192 node mobile/engine/build.cjs

      # 2) Native React Native (Expo) app
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Copy engine into Android assets
        run: |
          mkdir -p mobile/android/app/src/main/assets/engine
          cp -r mobile/engine/dist/* mobile/android/app/src/main/assets/engine/
          ls -lh mobile/android/app/src/main/assets/engine

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk CyberChef-mobile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CyberChef-mobile-apk
          path: CyberChef-mobile.apk
